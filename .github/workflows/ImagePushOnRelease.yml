name: Docker image creation and push to Dockerhub on release

on:
  release:
    types: [ published ]

jobs:

  create-push:
    name: Docker Image Build and Push (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Run create_image script for release
        working-directory: ./docker
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TERM: xterm
        run: |
          chmod +x ./create_image.sh
          ./create_image.sh release

  deploy:
    name: Deploy to Virtual Machine (CD)
    needs: create-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          DOCKERHUB_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "DOCKERHUB_USER=$DOCKERHUB_USER bash -s" < ./docker/deploy.sh latest-compose
