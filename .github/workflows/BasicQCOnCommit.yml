name: Basic Quality Control on Commit

on:
  push:
    branches-ignore:
      - main

jobs:

  # Backend
  backend-basic:
    name: Backend Basic Quality Control
    runs-on: ubuntu-latest

    # Database service
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: rarecips
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Create env.properties from secrets
        working-directory: ./backend/src/main/resources
        run: |
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" > env.properties
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> env.properties

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile Backend
        working-directory: ./backend
        run: mvn clean compile

      - name: Run Unit Tests
        working-directory: ./backend
        run: |
          mvn clean test -Dtest="backend/unit/**/*Test"
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/rarecips
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-basic-test-results
          path: |
            backend/target/surefire-reports/**
            backend/target/test-classes/**