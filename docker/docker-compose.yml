# In project root:
# docker pull blasetvrtumi/rarecips
# cd docker
# docker-compose -p rarecips up --build

services:

  rarecips-app:

    container_name: rarecips-app
    image: blasetvrtumi/rarecips:0.2
    build:
      context: ../
      dockerfile: docker/Dockerfile
    ports:
      - "8443:8443"
    depends_on:
      rarecips-DB:
        condition: service_healthy
    command: [ "/bin/sh", "-c", "./wait-for-it.sh rarecips-DB:3306 --timeout=20 -- && java -jar /app/rarecips-1.0.jar" ]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://rarecips-DB:3306/rarecips
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      - APP_OLLAMA_URL=http://rarecips-ollama:11434
    secrets:
      - source: env_properties
        target: /run/secrets/env.properties

  rarecips-DB:
    container_name: rarecips-DB
    image: mysql:9.0.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: rarecips
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /var/lib/mysql

  rarecips-ollama:
    container_name: rarecips-ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    container_name: ollama-init
    image: curlimages/curl:latest
    restart: "no"
    command: >
      sh -c "
      echo 'Waiting for Ollama to be ready...';
      while ! curl -sSf http://rarecips-ollama:11434/api/tags > /dev/null; do sleep 2; done;
      echo 'Ollama is ready. Pulling llama3.2:1b...';
      curl -s -X POST http://rarecips-ollama:11434/api/pull -d '{\"model\": \"llama3.2:1b\"}';
      echo 'Model pulled successfully.';
      "
    depends_on:
      rarecips-ollama:
        condition: service_healthy

volumes:
  mysql:
  ollama_data:

secrets:
  env_properties:
    file: ../backend/src/main/resources/env.properties