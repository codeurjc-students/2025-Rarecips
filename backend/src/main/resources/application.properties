# MySQL database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/rarecips
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jackson.serialization.INDENT_OUTPUT=true
# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Server configuration
server.port=8443
spring.profiles.active=dev
# File configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

server.tomcat.max-http-form-post-size=52428800
server.tomcat.max-swallow-size=52428800

spring.web.forward-headers-strategy=native
# Log configuration
logging.level.com.rarecips=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Mustache configuration
spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.html
# JWT configuration
jwt.secret=${JWT_SECRET:change_me_local_dev}
# SSL configuration
server.ssl.key-store=classpath:keystore.jks
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:password}
server.ssl.key-password=${SSL_KEY_PASSWORD:password}
# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.config.import=optional:classpath:env.properties,optional:file:/run/secrets/env.properties
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# MinIO configuration
minio.internal.url=${MINIO_INTERNAL_URL:http://localhost:9000}
minio.external.url=${MINIO_EXTERNAL_URL:http://localhost:9000}
minio.access.key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret.key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.name=${MINIO_BUCKET:rarecips-images}
